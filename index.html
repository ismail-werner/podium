<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podium</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="description" content="Formula 1 and tennis news, in one calm place.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="#/"><img src="logo.svg" alt="" width="22" height="22">Podium</a>
    <div class="tabs" id="tabs" role="tablist"></div>
    <label class="search">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search stories">
      <kbd>/</kbd>
    </label>
  </div>
</nav>

<main id="home">
  <header class="intro wrap">
    <h1 id="title">Top stories.</h1>
    <p id="sub"></p>
  </header>
  <div class="pins wrap" id="pins"></div>
  <a class="hero wrap" id="hero" href="#"></a>

  <section class="wrap">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No stories found. Try a different search.</p>
  </section>
</main>

<article id="story" class="wrap" hidden></article>

<footer><div class="wrap">Copyright © 2026 Podium. Headlines link to their original publishers.</div></footer>
<script src="app.js"></script>
</body>
</html>
