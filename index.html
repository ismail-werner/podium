<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podium</title>
<meta name="description" content="Formula 1 and tennis news, in one calm place.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<nav aria-label="Primary">
  <div class="wrap">
    <a class="logo" href="./" translate="no"><img src="logo.svg" alt="" width="22" height="22"><span>Podium</span></a>
    <div class="tabs" id="tabs" role="tablist" aria-label="Sport"></div>
    <label class="search">
      <svg aria-hidden="true" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg>
      <input id="q" name="q" type="search" placeholder="Search stories…" autocomplete="off" spellcheck="false" aria-label="Search stories">
      <kbd aria-hidden="true">/</kbd>
    </label>
  </div>
</nav>

<main id="main">
  <div id="home">
    <header class="intro wrap" aria-live="polite">
      <h1 id="title">Top stories.</h1>
      <p id="sub"></p>
    </header>
    <div class="pins wrap" id="pins" aria-label="Pinned picks"></div>
    <a class="hero wrap" id="hero" href="#"></a>

    <section class="wrap" aria-label="Stories">
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" role="status" hidden>No stories found. Try a different search.</p>
    </section>
  </div>

  <article id="story" class="wrap" hidden></article>
</main>

<footer><div class="wrap">Copyright © 2026 <span translate="no">Podium</span>. Headlines link to their original publishers.</div></footer>
<script src="app.js"></script>
</body>
</html>
